name: publish-pypi

# Publishes clients/python to PyPI with trusted publishing (OIDC): no token
# stored anywhere. PyPI side: Account settings -> Publishing -> pending publisher
# for project "liquidvision", owner lv-analytics, repo liquidvision-mcp,
# workflow publish-pypi.yml, environment pypi.
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl && python -c "import liquidvision; print(liquidvision.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: clients/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
